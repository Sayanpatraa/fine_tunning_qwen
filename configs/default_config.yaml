# =========================
# Base model
# =========================
model_name: "Qwen/Qwen2.5-3B-Instruct"
trust_remote_code: true

# =========================
# Paths
# =========================
raw_data_dir: "data/raw"
processed_data_dir: "data/processed"
output_dir: "models/writing_prompts_lora"
merged_model_dir: "models/writing_prompts_merged"

# =========================
# Dataset
# =========================
train_source_file: "train.wp_source"
train_target_file: "train.wp_target"
valid_source_file: "valid.wp_source"
valid_target_file: "valid.wp_target"
test_source_file: "test.wp_source"
test_target_file: "test.wp_target"

max_train_samples: null
max_eval_samples: 1000
max_test_samples: 1000

prompt_template: |
  <|user|>
  Write a creative story based on this prompt:

  {prompt}
  <|assistant|>
  {story}

inference_template: |
  <|user|>
  Write a creative story based on this prompt:

  {prompt}
  <|assistant|>

# =========================
# Tokenization
# =========================
max_seq_length: 2048
packing: true

# =========================
# Quantization
# =========================
load_in_4bit: true
bnb_4bit_quant_type: "nf4"
bnb_4bit_compute_dtype: "bfloat16"
bnb_4bit_use_double_quant: true

# =========================
# LoRA / QLoRA
# =========================
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_bias: "none"
target_modules:
  - "q_proj"
  - "k_proj"
  - "v_proj"
  - "o_proj"
  - "gate_proj"
  - "up_proj"
  - "down_proj"

# =========================
# Training
# =========================
num_train_epochs: 1
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 0.0002
warmup_ratio: 0.03
weight_decay: 0.0
max_grad_norm: 0.3
logging_steps: 25
eval_steps: 500
save_steps: 500
save_total_limit: 2
seed: 42
gradient_checkpointing: true
optim: "paged_adamw_8bit"
lr_scheduler_type: "cosine"
report_to: "none"
bf16: true
fp16: false

# =========================
# Generation / testing
# =========================
max_new_tokens: 700
temperature: 0.8
top_p: 0.9
top_k: 50
do_sample: true
repetition_penalty: 1.08
num_return_sequences: 1


# =========================
# Adversarial self-optimization
# =========================
adversarial_output_dir: "models/adversarial_runs"
preference_data_dir: "data/preferences"

self_optimize_iterations: 3
prompts_per_iteration: 128
candidates_per_prompt: 4

# Critic scoring weights.
# These are heuristic and do not require an external judge model.
critic_weight_prompt_relevance: 0.30
critic_weight_diversity: 0.20
critic_weight_repetition_penalty: 0.20
critic_weight_length: 0.15
critic_weight_story_shape: 0.15

min_story_words: 120
max_story_words: 900
max_repetition_ratio: 0.18

# DPO update after adversarial pair creation
dpo_beta: 0.1
dpo_num_train_epochs: 1
dpo_learning_rate: 0.00005
dpo_per_device_train_batch_size: 1
dpo_gradient_accumulation_steps: 8
dpo_max_prompt_length: 512
dpo_max_length: 2048
dpo_save_steps: 250
dpo_logging_steps: 25
